name: ai-novel-writing-assistant

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ai_novel_writing_assistant_postgres_data:/var/lib/postgresql/data
    networks:
      - ai_novel_writing_assistant_network

  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:16333:6333"
      - "127.0.0.1:16334:6334"
    volumes:
      - ai_novel_writing_assistant_qdrant_data:/qdrant/storage
    networks:
      - ai_novel_writing_assistant_network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "127.0.0.1:3165:3000"
    volumes:
      - ai_novel_writing_assistant_storage:/app/server/storage
    networks:
      - ai_novel_writing_assistant_network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8045:8080"
    volumes:
      - type: bind
        source: ./infra/nginx/ai-novel-remote.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    networks:
      - ai_novel_writing_assistant_network

networks:
  ai_novel_writing_assistant_network:
    driver: bridge

volumes:
  ai_novel_writing_assistant_postgres_data:
  ai_novel_writing_assistant_qdrant_data:
  ai_novel_writing_assistant_storage:
